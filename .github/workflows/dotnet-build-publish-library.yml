name: Build, test, and publish

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  Configuration: Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Nerdbank.GitVersioning needs full history

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/CCSWE.Avalonia.Hosting.slnx

      - name: Build
        run: dotnet build src/CCSWE.Avalonia.Hosting.slnx -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test src/CCSWE.Avalonia.Hosting.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/CCSWE.Avalonia.Hosting.slnx -c Release --no-build -o "${{ github.workspace }}/artifacts"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ${{ github.workspace }}/artifacts/*

      - name: Publish to NuGet.org
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  dependabot-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      - id: app-token
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}

      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        # Behind base (strict required checks): rebase it; the re-run CI merges it.
        run: gh pr merge "$PR_URL" --squash || gh pr update-branch "$PR_URL" --rebase
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
